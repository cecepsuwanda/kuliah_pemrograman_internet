<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="CV, Curriculum Vitae, Web Developer, HTML, Mahasiswa, JSON, JavaScript">
    <meta name="author" content="Cecep Maulana">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Cecep Maulana — Curriculum Vitae">
    <meta property="og:description" content="Contoh CV: data dari berkas JSON, diisi ke halaman dengan JavaScript.">
    <meta property="og:url" content="https://example.com/cv.html">
    <meta property="og:locale" content="id_ID">

    <title>Memuat CV…</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231a365d'/%3E%3Ctext x='16' y='22' font-size='14' fill='white' text-anchor='middle' font-family='system-ui,sans-serif'%3ECV%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="stylesheet" href="cv.css">
</head>
<body class="halaman-cv">
    <noscript>
        <p style="padding:1rem;background:#fef3c7;color:#92400e;font-family:system-ui,sans-serif;">
            Aktifkan JavaScript untuk memuat data CV dari <code>cv-data.json</code>.
        </p>
    </noscript>

    <div class="cv-shell">
        <aside class="cv-sidebar" aria-label="Profil dan navigasi">
            <header>
                <h1 id="cv-name"></h1>
                <p><strong id="cv-role"></strong></p>
                <p id="cv-location"></p>
                <address id="cv-address"></address>
            </header>

            <nav class="cv-nav" aria-label="Navigasi CV">
                <p>Isi halaman</p>
                <ol id="cv-nav-list"></ol>
            </nav>
        </aside>

        <div class="cv-konten">
            <main>
                <section id="ringkasan" aria-labelledby="judul-ringkasan">
                    <h2 id="judul-ringkasan"></h2>
                    <p id="cv-ringkasan-text"></p>
                </section>

                <section id="keterampilan" aria-labelledby="judul-keterampilan">
                    <h2 id="judul-keterampilan"></h2>
                    <dl id="cv-skills"></dl>
                </section>

                <section id="pengalaman" aria-labelledby="judul-pengalaman">
                    <h2 id="judul-pengalaman"></h2>
                    <div id="cv-experience"></div>
                </section>

                <section id="pendidikan" aria-labelledby="judul-pendidikan">
                    <h2 id="judul-pendidikan"></h2>
                    <table>
                        <caption id="cv-education-caption"></caption>
                        <thead>
                            <tr>
                                <th scope="col">Jenjang</th>
                                <th scope="col">Institusi</th>
                                <th scope="col">Program/Jurusan</th>
                                <th scope="col">Periode</th>
                            </tr>
                        </thead>
                        <tbody id="cv-education-body"></tbody>
                    </table>
                </section>

                <section id="portofolio" aria-labelledby="judul-portofolio">
                    <h2 id="judul-portofolio"></h2>
                    <ul id="cv-portfolio-list"></ul>
                </section>

                <section id="sertifikasi" aria-labelledby="judul-sertifikasi">
                    <h2 id="judul-sertifikasi"></h2>
                    <ul id="cv-sertifikasi-list"></ul>
                </section>

                <section id="organisasi" aria-labelledby="judul-organisasi">
                    <h2 id="judul-organisasi"></h2>
                    <ul id="cv-organisasi-list"></ul>
                </section>

                <section id="kontak" aria-labelledby="judul-kontak">
                    <h2 id="judul-kontak"></h2>
                    <p id="cv-kontak-text"></p>
                </section>
            </main>

            <footer class="cv-footer">
                <p id="cv-footer-text"></p>
            </footer>
        </div>
    </div>

    <!-- Salinan isi cv-data.json: dipakai saat fetch("cv-data.json") tidak jalan (mis. file://). Jika hanya mengedit cv-data.json dan membuka lewat server, blok ini boleh disamakan manual atau diabaikan. -->

    <script src="cv.js" defer></script>
</body>
</html>
